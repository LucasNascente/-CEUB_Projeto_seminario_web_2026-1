x-web-health: &web-health
  test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=7)"]
  interval: 5s
  timeout: 8s
  retries: 12

x-db-health: &db-health
  test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
  interval: 3s
  timeout: 3s
  retries: 15

x-tickets-build: &tickets-build
  context: .
  dockerfile: chamados-service/Dockerfile
  args:
    SERVICE: chamados-service

x-tickets-env: &tickets-env
  DATABASE_URL: postgresql+psycopg://helpdesk:${TICKETS_DB_PASSWORD:?Gere o arquivo .env}@db-tickets:5432/helpdesk_tickets
  USERS_URL: http://usuarios:8000
  SERVICE_KEY: ${SERVICE_KEY:?Gere o arquivo .env}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-1}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/health"]
      interval: 5s
      timeout: 8s
      retries: 12
    networks: [edge]

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        SERVICE: gateway
    environment:
      USERS_URL: http://usuarios:8000
      TICKETS_URL: http://chamados:8000
    depends_on:
      usuarios:
        condition: service_healthy
      chamados:
        condition: service_healthy
    healthcheck: *web-health
    networks: [edge, services]

  usuarios:
    build:
      context: .
      dockerfile: usuarios-service/Dockerfile
      args:
        SERVICE: usuarios-service
    environment:
      DATABASE_URL: postgresql+psycopg://helpdesk:${USERS_DB_PASSWORD:?Gere o arquivo .env}@db-users:5432/helpdesk_users
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Gere o arquivo .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Gere o arquivo .env}
      SERVICE_KEY: ${SERVICE_KEY:?Gere o arquivo .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    depends_on:
      db-users:
        condition: service_healthy
    healthcheck: *web-health
    networks: [services, users-data]

  chamados:
    build: *tickets-build
    environment: *tickets-env
    depends_on:
      db-tickets:
        condition: service_healthy
    healthcheck: *web-health
    networks: [services, tickets-data]

  db-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:?Gere o arquivo .env}
      POSTGRES_DB: helpdesk_users
    healthcheck: *db-health
    volumes:
      - users-data:/var/lib/postgresql/data
    networks: [users-data]

  db-tickets:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${TICKETS_DB_PASSWORD:?Gere o arquivo .env}
      POSTGRES_DB: helpdesk_tickets
    healthcheck: *db-health
    volumes:
      - tickets-data:/var/lib/postgresql/data
    networks: [tickets-data]

  mailer:
    profiles: [email]
    build: *tickets-build
    environment: *tickets-env
    command: [flask, --app, app, send-emails]
    depends_on:
      chamados:
        condition: service_healthy
      usuarios:
        condition: service_healthy
    networks: [services, tickets-data, mail-egress]

networks:
  edge:
  services:
    internal: true
  users-data:
    internal: true
  tickets-data:
    internal: true
  mail-egress:

volumes:
  users-data:
  tickets-data:
