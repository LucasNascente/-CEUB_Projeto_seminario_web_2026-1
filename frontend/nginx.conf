limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_gateway http://gateway:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 25s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    location = /api/users/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limit;
        proxy_pass $api_gateway;
    }

    location @login_limit {
        default_type application/json;
        return 429 '{"error":"Muitas tentativas. Aguarde e tente novamente."}';
    }

    location /api/ {
        proxy_pass $api_gateway;
    }

    location = /ready {
        proxy_pass $api_gateway;
    }

    location = /health {
        proxy_pass $api_gateway;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
